<!--
  The tab icon: the same chip-and-key mark as `logo.png`, not a separate redraw.

  The earlier mascot needed two different drawings because its full artwork — a binary ring, six hearts, two
  shields, three stars and a chip carrying readable code — resolved to a green smudge at 16 CSS pixels, so this
  file used to keep only the three shapes that survived: the pink ring, the green field, the chip's face. This
  mark doesn't have that problem. It was built from one rule (every stroke — ring, bar, elbow, pad, pin — is the
  same thickness) specifically so there is nothing left to simplify away; it was verified at a real rendered
  16x16 before being committed here, not assumed to scale down cleanly because it looks clean at 256px.

  The viewBox is cropped tight to the drawn content (2-unit margin, not the roomier square crop `logo.png` uses)
  because at 16px every pixel of fill is legible pixel budget — the wider sidebar mark can afford the breathing
  room, a tab icon cannot.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="5 16 54 32" width="54" height="32" role="img" aria-label="FirmLab">
  <rect x="11" y="18" width="42" height="28" rx="5" ry="5" fill="#08090b" />
  <g stroke="#08090b" stroke-width="3.5" stroke-linecap="round">
    <line x1="7" y1="23" x2="11" y2="23" />
    <line x1="7" y1="29" x2="11" y2="29" />
    <line x1="7" y1="35" x2="11" y2="35" />
    <line x1="7" y1="41" x2="11" y2="41" />
    <line x1="53" y1="23" x2="57" y2="23" />
    <line x1="53" y1="29" x2="57" y2="29" />
    <line x1="53" y1="35" x2="57" y2="35" />
    <line x1="53" y1="41" x2="57" y2="41" />
  </g>
  <circle cx="22" cy="26" r="6.5" fill="#c9f23a" />
  <circle cx="22" cy="26" r="3" fill="#08090b" />
  <rect x="28.5" y="24.25" width="15.5" height="3.5" fill="#c9f23a" />
  <rect x="42.25" y="24.25" width="3.5" height="15.75" fill="#c9f23a" />
  <rect x="40.5" y="37" width="7" height="7" fill="#c9f23a" />
</svg>
