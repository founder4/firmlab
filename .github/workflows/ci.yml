name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/setup@v2
        with:
          version: 11.23.0
          install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit

      - name: Check formatting and static guards
        run: pnpm biome

      - name: Check types
        run: pnpm check

      - name: Run tests
        run: pnpm test

      - name: Build workspace
        run: pnpm build

  docker:
    name: Docker smoke test
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build runtime image
        run: docker build --tag firmlab:ci .

      - name: Start image and verify health
        shell: bash
        run: |
          set -euo pipefail
          container_id="$(docker run --detach --rm --publish 127.0.0.1:8799:8799 firmlab:ci)"
          trap 'docker rm --force "$container_id" >/dev/null 2>&1 || true' EXIT

          for _ in {1..30}; do
            response="$(curl --fail --silent http://127.0.0.1:8799/health || true)"
            if [[ "$response" == *'"status":"ok"'* ]]; then
              printf '%s\n' "$response"
              exit 0
            fi
            sleep 2
          done

          docker logs "$container_id"
          exit 1
