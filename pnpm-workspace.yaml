  better-sqlite3: true
  esbuild: true
overrides:
  hono: ^4.13.11
  ip-address: ^10.7.4
  'brace-expansion@^5.0.0': ^5.0.12
  'fast-uri@^3.0.0': ^3.1.9
  'fast-uri@^4.0.0': ^4.2.3
  qs: ^6.16.1
  undici: ^7.30.1
  vite: ^6.4.5
