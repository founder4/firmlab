# FirmLab — local-only deployment.
#
# The API port is published ONLY to the host loopback (127.0.0.1), so the workbench and the firmware images it
# holds are never reachable from the network. To use the full toolchain (extraction, decompilation, SBOM,
# emulation), build the firmware image and set `image: firmlab-firmware` below.
#
# Outbound network (operator decision, 2026-10-04): the research lane is ON by default with nothing set here — it
# queries the allowlisted advisory hosts (OSV, NVD, CISA KEV) with component names and versions only, never firmware
# bytes, and only when a run is started. To keep this deployment fully offline, add `FIRMLAB_RESEARCH: '0'` below
# (or switch it off in Settings › Privacy, which is stored in the data volume and beats this file). Online hash
# lookup and the capture lane stay off unless you set FIRMLAB_HASH_LOOKUP / FIRMLAB_CAPTURE yourself; emulated
# firmware stays cut off from the internet (FIRMLAB_EMU_ISOLATE defaults on).

services:
  firmlab:
    build:
      context: .
      dockerfile: Dockerfile
    image: firmlab:latest
    # Bind to loopback only — do NOT change to 0.0.0.0 unless you intend to expose the workbench.
    ports:
      - '127.0.0.1:8799:8799'
    environment:
      FIRMLAB_HOST: '0.0.0.0'
      FIRMLAB_PORT: '8799'
      FIRMLAB_DATA_DIR: '/data'
      FIRMLAB_YARA_RULES: '/data/yara-rules/external/yara-forge-core.yar:/data/yara-rules/local/operator-firmware-policy.yar'
      FIRMLAB_LOOPBACK_PUBLISH: '1'
      FIRMLAB_MAX_UPLOAD: '524288000'
    volumes:
      - firmlab-data:/data
    restart: unless-stopped

volumes:
  firmlab-data:
